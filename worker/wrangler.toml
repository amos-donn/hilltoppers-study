# StudyStream Worker. The Topping website is served by GitHub Pages; this Worker
# only answers /api/*. The binding and database ids below match the deployed
# Worker and D1 database in the Cloudflare dashboard.
name = "hilltoppers-study"
main = "src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true

# Rate-limit unauthenticated lookup and room-code endpoints.
[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "3403"
simple = { limit = 30, period = 60 }

# Stale accounts, sessions and signaling rows are swept hourly so a public
# deploy does not accumulate old identities.
[triggers]
crons = ["0 * * * *"]

[vars]
# Origins allowed to call /api. The Topping is hosted on GitHub Pages.
ALLOWED_ORIGINS = "https://amos-donn.github.io"

[[d1_databases]]
binding = "DB_BINDING"
database_name = "studystream-sessions"
database_id = "7cfc650d-c260-4857-b3cc-8f23b36223cb"

# Set SESSION_HMAC_KEY with `npx wrangler secret put SESSION_HMAC_KEY`.
# It signs account tokens; the Worker refuses to serve /api with a missing or
# short key instead of falling back to a guessable default.
