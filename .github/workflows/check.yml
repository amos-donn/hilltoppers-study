name: Check Hilltoppers Study

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Type-check the Worker
        run: npm run typecheck
      - name: Build the Worker
        working-directory: .
        run: npx --prefix worker wrangler deploy --dry-run --outdir /tmp/dist --config wrangler.toml
      - name: Check the site scripts parse
        run: node --check ../app.js && node --check ../config.js && node --check ../resize.js && node --check ../sw.js
