# StudyStream Worker.
#
# Cloudflare is connected to this repository root, so this file lives at the
# root too, not inside worker/. It runs the Worker in worker/src/index.ts and
# exposes the D1 database as DB_BINDING. The Topping website itself is served by
# GitHub Pages; this Worker only answers /api/*.
name = "hilltoppers-study"
main = "worker/src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true

# Rate-limit unauthenticated lookup and room-code endpoints.
[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "3403"
simple = { limit = 30, period = 60 }

# Stale accounts, sessions and signaling rows are swept hourly so a public
# deploy does not accumulate old identities.
[triggers]
crons = ["0 * * * *"]

[vars]
# Origins allowed to call /api. The Topping is hosted on GitHub Pages.
ALLOWED_ORIGINS = "https://amos-donn.github.io"

[[d1_databases]]
binding = "DB_BINDING"
database_name = "studystream-sessions"
database_id = "7cfc650d-c260-4857-b3cc-8f23b36223cb"

# Set SESSION_HMAC_KEY in the dashboard (Settings -> Variables and Secrets), or
# with `npx wrangler secret put SESSION_HMAC_KEY`. It signs account tokens; the
# Worker refuses to serve /api with a missing or short key instead of falling
# back to a guessable default.
#
# Set TURN_KEY_ID and TURN_API_TOKEN the same way to hand out Cloudflare TURN
# relay credentials, which is what lets screen sharing work on a network that
# blocks peer-to-peer. See "Relay (TURN)" in the README. While they are unset,
# /api/turn reports configured:false and clients use the public PeerJS cloud.
